<!doctype html>
<html lang="es" data-theme="identidad">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>JeaDas.Insights · Gestor Calificaciones HS</title>

  <meta name="robots" content="noindex">
  <meta name="application-name" content="JeaDas.Insights">
  <meta name="theme-color" content="#13235A">

  <!-- TEMA GUARDADO -->
  <script>
    try {
      const tema = JSON.parse(
        localStorage.getItem('sge.tema') || '{}'
      );

      if (tema.modo) {
        document.documentElement.dataset.theme = tema.modo;
      }
    } catch (e) {
      console.warn('No se pudo recuperar el tema guardado.');
    }
  </script>

  <!-- ICONOS -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32"
        href="./assets/icons/favicon-32x32.png">

  <link rel="icon" type="image/png" sizes="16x16"
        href="./assets/icons/favicon-16x16.png">

  <link rel="apple-touch-icon" sizes="180x180"
        href="./assets/icons/apple-touch-icon.png">

  <link rel="manifest" href="./manifest.webmanifest">

  <!-- ESTILOS -->
  <link rel="stylesheet" href="./css/splash.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/componentes.css">
  <link rel="stylesheet" href="./dist/utilidades.css">

  <!-- CONTROL INICIAL DEL SPLASH -->
  <style>
    #splash-screen {
      display: flex;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #splash-screen.splash-ocultando {
      pointer-events: none;
    }
  </style>

</head>

<body>

  <!-- =====================================================
       SPLASH SCREEN
       BIENVENIDA / DESPEDIDA
       ===================================================== -->

  <div
    id="splash-screen"
    role="status"
    aria-live="polite"
    aria-atomic="true"
    aria-hidden="false"
  >

    <!-- LUCES DECORATIVAS -->
    <div class="splash-luz splash-luz--a"></div>
    <div class="splash-luz splash-luz--b"></div>

    <!-- TARJETA CENTRAL -->
    <div id="splash-card">

      <div class="splash-brillo"></div>

      <div class="splash-identidad">

        <img
          src="./favicon.svg"
          alt=""
          width="64"
          height="64"
          class="jdi-splash-logo"
        >

        <h1 id="splash-titulo">
          JeaDas<span>.Insights</span>
        </h1>

        <p id="splash-mensaje">
          Gestor Calificaciones HS
        </p>

      </div>

      <!-- BARRA DE PROGRESO -->
      <div id="splash-progress-bar">
        <div class="splash-relleno"></div>
      </div>

    </div>

  </div>

  <!-- =====================================================
       CONTROLADOR DEL SPLASH
       ===================================================== -->

  <script>
  (function () {

    'use strict';

    const TIEMPO_BIENVENIDA = 5000;
    const TIEMPO_DESPEDIDA = 2500;
    const TIEMPO_TRANSICION = 800;

    const splash = document.getElementById('splash-screen');
    const mensaje = document.getElementById('splash-mensaje');
    const barra = document.querySelector('.splash-relleno');

    if (!splash || !mensaje) return;

    let temporizador = null;
    let temporizadorSalida = null;

    let estado = 'bienvenida';

    function cancelarTemporizadores() {
      clearTimeout(temporizador);
      clearTimeout(temporizadorSalida);
    }

    function reiniciarBarra(duracion) {

      if (!barra) return;

      barra.style.animation = 'none';
      barra.style.width = '0%';

      void barra.offsetWidth;

      barra.style.width = '';
      barra.style.animation =
        `splashLineLoad ${duracion}ms cubic-bezier(.4,0,.2,1) forwards`;

    }

    function mostrar(texto, duracion, destino = null) {

      cancelarTemporizadores();

      estado = destino ? 'despedida' : 'bienvenida';

      mensaje.textContent = texto;

      splash.classList.remove(
        'splash-ocultando',
        'forzar-despedida'
      );

      splash.style.display = 'flex';
      splash.style.opacity = '1';
      splash.style.visibility = 'visible';

      splash.setAttribute('aria-hidden', 'false');

      if (estado === 'despedida') {
        splash.classList.add('forzar-despedida');
      }

      reiniciarBarra(duracion);

      temporizador = setTimeout(function () {

        splash.classList.add('splash-ocultando');

        temporizadorSalida = setTimeout(function () {

          splash.style.display = 'none';

          splash.setAttribute('aria-hidden', 'true');

          splash.classList.remove(
            'splash-ocultando',
            'forzar-despedida'
          );

          estado = 'oculto';

          if (destino) {
            window.location.assign(destino);
          }

        }, TIEMPO_TRANSICION);

      }, duracion);

    }

    window.JDISplash = {

      bienvenida: function () {

        if (estado === 'despedida') return;

        mostrar(
          'Gestor Calificaciones HS',
          TIEMPO_BIENVENIDA
        );

      },

      despedida: function (destino = './login.html') {

        mostrar(
          'Gracias por utilizar JeaDas.Insights. ¡Hasta pronto!',
          TIEMPO_DESPEDIDA,
          destino
        );

      },

      ocultar: function () {

        cancelarTemporizadores();

        splash.classList.add('splash-ocultando');

        temporizadorSalida = setTimeout(function () {

          splash.style.display = 'none';
          splash.setAttribute('aria-hidden', 'true');

          estado = 'oculto';

        }, TIEMPO_TRANSICION);

      },

      mostrar: mostrar,

      get estado() {
        return estado;
      }

    };

    // Cada carga de app.html inicia una nueva bienvenida.
    window.JDISplash.bienvenida();

  })();
  </script>

  <!-- =====================================================
       ACCESIBILIDAD
       ===================================================== -->

  <a class="saltar" href="#contenido">
    Saltar al contenido
  </a>

  <!-- =====================================================
       BARRA SUPERIOR
       ===================================================== -->

  <header class="barra">

    <div class="marca-app">

      <img
        src="./favicon.svg"
        alt=""
        width="36"
        height="36"
        class="logo-marca"
      >

      <div>
        <b>JeaDas.Insights</b>
        <small>Gestor Calificaciones HS</small>
      </div>

    </div>

    <div
      id="contexto"
      class="barra__contexto"
      hidden
    ></div>

    <div class="barra__der">

      <div
        class="barra__usuario"
        id="usuario-actual"
      ></div>

      <div id="apariencia"></div>

      <button
        type="button"
        class="btn btn--secundario btn--compacto"
        id="salir"
        style="color:inherit;border-color:currentColor"
      >
        Salir
      </button>

    </div>

  </header>

  <!-- =====================================================
       NAVEGACIÓN
       ===================================================== -->

  <nav
    class="pestanas"
    id="menu"
    aria-label="Secciones"
  ></nav>

  <!-- =====================================================
       AVISO DE DEMOSTRACIÓN
       ===================================================== -->

  <div
    id="demo-aviso"
    class="banner"
    hidden
    style="margin:0.75rem max(1rem, env(safe-area-inset-left)) 0"
    role="note"
  >

    <strong>Modo demostración</strong>

    Los datos son ficticios y se guardan solo en esta pestaña
    del navegador.

  </div>

  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <main
    id="contenido"
    class="pagina"
    tabindex="-1"
    aria-live="polite"
  ></main>

  <!-- =====================================================
       PIE DE PÁGINA
       ===================================================== -->

  <footer class="pie-app">
    JeaDas.Insights - Gestor Calificaciones HS
  </footer>

  <!-- =====================================================
       APLICACIÓN PRINCIPAL
       ===================================================== -->

  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>
</html>
